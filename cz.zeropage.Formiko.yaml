app-id: cz.zeropage.Formiko
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: formiko
rename-icon: formiko
copy-icon: true
rename-desktop-file: formiko.desktop
rename-appdata-file: formiko.metainfo.xml
finish-args:
  - --share=ipc
  - --device=dri
  - --socket=fallback-x11
  - --socket=wayland
  - --share=network
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=xdg-run/gvfs
  - --filesystem=xdg-run/gvfsd
  - --talk-name=org.gtk.vfs.*
cleanup:
  - /include
  - /lib/pkgconfig
  - /share/pkgconfig
  - /share/aclocal
  - /man
  - /share/man
  - /share/gtk-doc
  - /share/vala
  - '*.la'
  - '*.a'
modules:
  - python3-requirements.yaml
  - name: formiko
    buildsystem: simple
    build-commands:
      - pip3 install --no-build-isolation --prefix=${FLATPAK_DEST} .
    sources:
      - type: git
        url: https://github.com/ondratu/formiko.git
        commit: 82dc8ec3f2ebdeea698eb8716020ab683bf76edb
